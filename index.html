<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Tap & Earn Bot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org"></script>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <h3 id="username-display">Hello, User</h3>
            <div class="balance-box">
                <span id="balance">0</span> <small>Coins</small>
            </div>
        </div>

        <!-- ট্যাপ করার মূল পেজ -->
        <div id="tap-page" class="page-content">
            <div class="coin-section">
                <!-- এখানে ফাংশনের নাম handleTap() দেওয়া হয়েছে -->
                <button id="tap-btn" onclick="handleTap()">🪙</button>
            </div>
        </div>

        <!-- টাস্ক পেজ -->
        <div id="tasks-page" class="page-content hidden">
            <h3>📋 Available Tasks</h3>
            <div class="task-card">
                <p>https://t.me/TakaVault</p>
                <small>Reward: +5000 Coins</small>
                <button id="task1-btn" onclick="completeTask('https://t.me', 5000, 'task1')">Join Channel</button>
            </div>
        </div>

        <!-- রেফারেল পেজ -->
        <div id="refer-page" class="page-content hidden">
            <h3>👥 Invite Friends</h3>
            <p>Per Refer Reward: <b>+2000 Coins</b></p>
            <div class="refer-box">
                <input type="text" id="refer-link" readonly value="Loading...">
                <button onclick="copyReferLink()">Copy</button>
            </div>
        </div>

        <!-- উইথড্র পেজ -->
        <div id="withdraw-page" class="page-content hidden">
            <h3>💰 Withdraw Money</h3>
            <p style="font-size: 0.9rem; color: #ccc;">Minimum Withdraw: 50,000 Coins</p>
            <div class="withdraw-form">
                <select id="method">
                    <option value="bkash">bKash</option>
                    <option value="nagad">Nagad</option>
                    <option value="recharge">Mobile Recharge</option>
                </select>
                <input type="number" id="wallet-number" placeholder="Enter Your Number">
                <input type="number" id="withdraw-amount" placeholder="Enter Amount of Coins">
                <button onclick="processWithdraw()">Submit Request</button>
            </div>
        </div>

        <!-- বটম মেনু -->
        <div class="bottom-nav">
            <button onclick="switchPage('tap-page')">🪙 Tap</button>
            <button onclick="switchPage('tasks-page')">📋 Tasks</button>
            <button onclick="switchPage('refer-page')">👥 Refer</button>
            <button onclick="switchPage('withdraw-page')">💰 Withdraw</button>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
